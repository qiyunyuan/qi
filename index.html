<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >
    <meta name="application-name" content="祁韵机">
    <title>祁韵机</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fcebf3">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <!-- 主页内容 -->
    <div id="page-home" class="page active">
        <!-- 个人资料区域 -->
        <div class="profile-section">
            <div class="avatar"></div>
            <div class="nickname">OvO</div>
            <div class="bio">我想要暖暖的幸福</div>
        </div>

        <!-- 时间卡片 (纯文字胶囊版) -->
         <div class="time-card">
            <div class="time-info">
                <div class="time-text">☆*爱 是唯一通向你的次元的钥匙*☆</div>
                <div class="time-value">
                    <span class="date-display">01/01 星期三</span>
                    <span id="clock-display">00:00</span>
                </div>
            </div>
        </div>

                <!-- 组件区域 -->
        <div class="menu-section">
            <!-- 左侧：对话组件 -->
            <div class="dream-card">
                <div class="dream-title">♰.𝐾𝑖𝑡𝑡𝑒𝑛.♰</div>
                
                <!-- 第一条：头像在左 -->
                <div class="dream-item">
                    <div class="mini-avatar"></div>
                    <span class="dream-text">愿你被世界所爱</span>
                </div>

                <!-- 第二条：头像在右 -->
                <div class="dream-item">
                    <span class="dream-text">你就是我的全世界</span>
                    <div class="mini-avatar"></div>
                </div>
            </div>

            <div class="right-apps">
                <!-- 第一个图标 -->
                <div class="app-group">
                    <div class="app-icon"></div>
                    <span class="app-name">APP1</span>
                </div>
                
                <!-- 第二个图标 -->
                <div class="app-group">
                    <div class="app-icon"></div>
                    <span class="app-name">APP2</span>
                </div>
            </div>

        </div>

                <!-- 底部四个APP图标 -->
        <div class="bottom-dock">
            <!-- 1 -->
            <div class="app-group">
                <div class="app-icon"></div>
                <span class="app-name">APP3</span>
            </div>
            <!-- 2 -->
            <div class="app-group">
                <div class="app-icon"></div>
                <span class="app-name">APP4</span>
            </div>
            <!-- 3 -->
            <div class="app-group">
                <div class="app-icon"></div>
                <span class="app-name">APP5</span>
            </div>
            <!-- 4 -->
            <div class="app-group">
                <div class="app-icon"></div>
                <span class="app-name">APP6</span>
            </div>
        </div>



</div>

<script src="js/script.js"></script>
</body>
</html>
